<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRYON — Super Admin Panel</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logo_final.png" />

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tryon: {
              DEFAULT: '#163326',
              hover: '#0e2219',
              light: '#e4efe7',
              bg: '#f8f9fa',
              border: '#eaeeec'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Custom Design System Styles -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="h-full bg-[#F8F9FA] text-[#111827] antialiased selection:bg-[#E4EFE7] selection:text-[#163326]">

  <!-- Application Root Container -->
  <div id="app-root" class="min-h-screen"></div>

  <!-- Supabase CDN & Client Integration -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>

  <!-- Application Core Scripts -->
  <script src="js/store.js"></script>
  <script src="js/components/sidebar.js"></script>
  <script src="js/components/header.js"></script>
  <script src="js/components/orderDrawer.js"></script>
  <script src="js/components/modals.js"></script>

  <!-- Page Modules -->
  <script src="js/pages/login.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/products.js"></script>
  <script src="js/pages/orders.js"></script>
  <script src="js/pages/customers.js"></script>
  <script src="js/pages/salesReport.js"></script>
  <script src="js/pages/revenue.js"></script>
  <script src="js/pages/profitLoss.js"></script>
  <script src="js/pages/settings.js"></script>

  <!-- Bootstrap App Controller -->
  <script src="js/app.js"></script>
</body>
</html>
